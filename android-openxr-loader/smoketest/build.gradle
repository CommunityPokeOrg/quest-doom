plugins {
    id 'com.android.application'
}

android {
    namespace 'org.communitypoke.openxrsmoke'
    compileSdk 34
    ndkVersion "27.2.12479018"
    defaultConfig {
        applicationId 'org.communitypoke.openxrsmoke'
        minSdk 24
        targetSdk 34
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt') }
    }
}
